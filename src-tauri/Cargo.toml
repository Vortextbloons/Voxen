[package]
name = "voxen"
version = "0.4.0"
edition = "2021"

[package.metadata]
authors = ["Voxen"]

[lib]
name = "voxen_lib"

[build-dependencies]
winres = "0.1"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", default-features = false, features = ["accessibility", "embedded-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
libloading = "0.8"
png = "0.18"
sha2 = "0.10"
ureq = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
clipboard-win = "5"

[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", package = "parley_engine" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", package = "wgpu-hal" }
winit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", package = "winit" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", package = "accesskit_windows" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
