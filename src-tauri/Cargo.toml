[package]
name = "voxen"
version = "0.1.0"
edition = "2021"

[package.metadata]
authors = ["Voxen"]

[package.metadata.tauri-winres]
OriginalFilename = "Voxen.exe"

[lib]
name = "voxen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
clipboard-win = "5"

